<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صالح الرابطي</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#0a0a0a;color:#fff;text-align:center}
.hero{padding:50px 20px;background:linear-gradient(180deg,#000,#1a1400)}
.hero img{width:130px;height:130px;border-radius:50%;border:4px solid #d4af37;object-fit:cover;box-shadow:0 0 25px #d4af37}
h1{margin:15px 0 5px;font-size:34px;color:#d4af37}
.hero p{color:#eee;font-size:18px}
.box{background:#161616;margin:20px;padding:20px;border-radius:15px;border:1px solid #d4af37}
.box h2{color:#d4af37;margin-top:0}
.skill{display:inline-block;background:#d4af37;color:#000;padding:8px 14px;border-radius:20px;margin:5px;font-weight:bold}
a.btn{display:block;background:#d4af37;color:#000;padding:14px;border-radius:10px;text-decoration:none;font-weight:bold;margin:10px 0;font-size:18px}
a.btn2{background:#fff;color:#000}
</style>
</head>
<body>
<div class="hero">
<img src="https://i.pravatar.cc/300" alt="صالح">
<h1>صالح الرابطي</h1>
<p>أهلا بيك في موقعي 👑<br>موقع فخم، لتعلم وتطوير مهاراتي</p>
</div>
<div class="box">
<h2>من أنا؟</h2>
<p>ندير في شغل خاص بيا ونطور مهاراتي يوم بعد يوم</p>
</div>
<div class="box">
<h2>مهاراتي</h2>
<span class="skill">تصميم</span>
<span class="skill">مواقع</span>
<span class="skill">سوشيال ميديا</span>
<span class="skill">تعلم سريع</span>
</div>
<div class="box">
<h2>تواصل معاي</h2>
<a class="btn" href="#">واتساب</a>
<a class="btn btn2" href="#">فيسبوك</a>
</div>
<p style="padding-bottom:20px;color:#d4af37">© 2026 صالح الرابطي - كل الحقوق محفوظة</p>
</body>
</html>
