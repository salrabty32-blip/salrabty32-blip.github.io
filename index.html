<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صالح الرابطي | موقعي الشخصي</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#0f172a;color:#fff;text-align:center}
.hero{padding:50px 20px;background:linear-gradient(135deg,#22c55e,#0ea5e9)}
.hero img{width:110px;height:110px;border-radius:50%;border:4px solid #fff;object-fit:cover}
h1{margin:15px 0 5px;font-size:32px}p{color:#e2e8f0;line-height:1.8}
.box{background:#1e293b;margin:20px;padding:20px;border-radius:16px;text-align:right}
.box h2{color:#22c55e;margin-top:0}
.skill{display:inline-block;background:#334155;padding:8px 14px;border-radius:20px;margin:5px}
a.btn{display:block;background:#22c55e;color:#000;padding:15px;margin:12px;border-radius:12px;text-decoration:none;font-weight:bold;font-size:18px}
a.btn2{background:#fff}
</style>
</head>
<body>
<div class="hero">
<img src="https://i.pravatar.cc/300" alt="صالح الرابطي">
<h1>صالح الرابطي</h1>
<p>أهلاً بيك في موقعي 👋<br>نحب نتعلم ونطور من روحي</p>
</div>
<div class="box">
<h2>من أنا؟</h2>
<p>أنا صالح الرابطي من بنغازي، ليبيا. نحب التقنية والتصميم، وهدفي ندير شغل خاص بيا ونطور مهاراتي يوم بعد يوم.</p>
</div>
<div class="box">
<h2>مهاراتي</h2>
<span class="skill">تصميم</span>
<span class="skill">مواقع</span>
<span class="skill">سوشيال ميديا</span>
<span class="skill">تعلم سريع</span>
</div>
<div class="box">
<h2>تواصل معاي</h2>
<a class="btn" href="#">واتساب</a>
<a class="btn btn2" href="#">فيسبوك</a>
</div>
<p style="padding-bottom:20px;color:#94a3b8">© 2026 صالح الرابطي</p>
</body>
</html>
